name: richup-telegram

services:
  bot:
    image: "${IMAGE_NAME:-richup-telegram}:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.14"
        APP_VERSION: "0.1.0"
    environment:
      BOT_TOKEN: "${BOT_TOKEN:?Set BOT_TOKEN before starting the container}"
      STREAM_DELAY_MS: "${STREAM_DELAY_MS:-350}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      JOIN_REQUEST_MODE: "${JOIN_REQUEST_MODE:-queue}"
      JOIN_REQUEST_WEB_APP_URL: "${JOIN_REQUEST_WEB_APP_URL:-}"
      DROP_PENDING_UPDATES: "${DROP_PENDING_UPDATES:-false}"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s
    networks:
      - bot_network

networks:
  bot_network:
    name: richup_telegram_net
    driver: bridge

